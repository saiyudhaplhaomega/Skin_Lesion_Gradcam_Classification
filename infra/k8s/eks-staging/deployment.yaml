apiVersion: apps/v1
kind: Deployment
metadata:
  name: skin-lesion-backend
  namespace: skin-lesion-staging
  labels:
    app: skin-lesion-backend
    environment: staging
    platform: eks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skin-lesion-backend
  template:
    metadata:
      labels:
        app: skin-lesion-backend
        environment: staging
        platform: eks
    spec:
      serviceAccountName: skin-lesion-backend
      containers:
        - name: skin-lesion-backend
          image: 526404916929.dkr.ecr.us-east-1.amazonaws.com/skin-lesion-backend-staging:local
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Allow up to 180 seconds for the ML model to load before liveness
          # and readiness probes begin evaluating the container.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
