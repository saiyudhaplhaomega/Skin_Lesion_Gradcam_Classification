apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skin-lesion-backend
  namespace: skin-lesion-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skin-lesion-backend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
