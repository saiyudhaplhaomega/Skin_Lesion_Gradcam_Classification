apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skin-lesion-backend
  namespace: skin-lesion-prod
  labels:
    app: skin-lesion-backend
    environment: prod
    platform: eks
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # Requires an owned domain, a validated ACM certificate, and DNS pointed at the ALB.
    alb.ingress.kubernetes.io/certificate-arn: "REPLACE_WITH_ACM_CERTIFICATE_ARN"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skin-lesion-backend
                port:
                  number: 8080
